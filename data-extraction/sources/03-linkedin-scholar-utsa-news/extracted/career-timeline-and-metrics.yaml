utsa_news_article:
  url: "https://news.utsa.edu/2025/11/university-of-buffalo-professor-and-computer-science-expert-named-new-dean-of-the-college-of-ai-cyber-and-computing/"
  published: "2025-11 (announcement, ahead of the March 2026 start date)"
  key_facts:
    - "Effective start date March 1, 2026, as founding dean."
    - "At time of announcement, was described as SUNY Empire Innovation Professor and director of UB's Institute for Artificial Intelligence and Data Science."
    - "PhD in computer engineering from UCLA (Outstanding PhD Award); MS in electrical/computer engineering from UW-Madison."
    - "200+ peer-reviewed papers, 9 best paper awards, 60+ US/international patents (per this article's count — differs slightly from Source 02's itemized counts; treat as a rounded PR summary, not a precise count)."
    - "Prior to UB: Program director/research scientist at IBM T.J. Watson Research Center; contributed to the Watson AI system that competed on Jeopardy! in 2011."
    - "Co-founded the IBM-Illinois Center for Cognitive Computing Systems Research (C3SR) in 2016, and the IBM Smarter Energy Research Institute."
    - "Directs the $20M National AI Institute for Exceptional Education (speech/language processing tech for children)."
    - "Leads the AI Thrust for the $10M National Center for Early Literacy and Responsible AI (generative AI for childhood literacy)."
    - "College of AI, Cyber and Computing at UTSA officially launched September 1, 2025."
  leadership_quote_paraphrased: >
    Xiong framed AI's value in terms of helping people solve problems in their own
    fields, and stressed that sustained investment in AI research is needed to build
    an AI-literate workforce for society's benefit.

