- id: ai-algorithms
  title: "AI Algorithms"
  shortDescription: "Probing limits of state-of-the-art models while innovating for modern architectures."
  longDescription: >
    X-Lab's AI algorithm research probes the limits of state-of-the-art models while
    innovating for modern architectures. Grounded in advanced deep learning
    mathematics and systems design, our work spans high-order neural networks, large
    language models, and adaptive learning techniques.
  order: 1

- id: ai-solutions
  title: "AI Solutions"
  shortDescription: "Leveraging AI to solve real-world problems across different domains."
  longDescription: >
    AI solutions are about leveraging AI technologies to solve real-world problems
    across different domains, from healthcare to education. At X-Lab, we focus on
    developing flexible and adaptable AI solutions tailored to specific needs,
    ensuring practical and impactful outcomes.
  order: 2

- id: ai-systems
  title: "AI Systems"
  shortDescription: "Integrating AI components for comprehensive, scalable solutions."
  longDescription: >
    AI systems integrate various AI components, such as algorithms, data, and
    hardware, to create comprehensive solutions that operate effectively in complex
    environments. X-Lab's research in AI systems focuses on optimizing these
    integrations to enhance performance, reliability, and scalability.
  order: 3

- id: ai-accelerators
  title: "AI Accelerators"
  shortDescription: "Specialized hardware for optimizing AI model performance."
  longDescription: >
    AI accelerators are specialized hardware designed to optimize the performance of
    AI models, particularly in terms of speed and energy efficiency. X-Lab is at the
    forefront of developing such accelerators to support high-performance computing
    needs in AI applications.
  order: 4

- id: ai-security
  title: "AI Security"
  shortDescription: "Protecting AI systems and ensuring ethical use of AI technologies."
  longDescription: >
    AI security focuses on protecting AI systems from potential threats and ensuring
    the ethical use of AI technologies. At X-Lab, our research addresses the critical
    aspects of AI security, including model robustness and ethical considerations in
    AI deployment.
  order: 5

- id: ai-tools
  title: "AI Development Tools"
  shortDescription: "Making AI development more accessible and efficient."
  longDescription: >
    We develop tools and frameworks that make AI development more accessible and
    efficient for researchers and practitioners, enabling faster prototyping and
    deployment of AI solutions.
  order: 6
