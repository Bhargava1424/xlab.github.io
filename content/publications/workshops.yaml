# Two pairs of same-titled entries below ("Statistical Ordering of Correlated Timing
# Quantities..." and "Statistical Multilayer Process Space Coverage for At-Speed Test")
# are flagged in the source as possible duplicates (NATW 2009 vs. ACM/IEEE Timing Issues,
# both May/Feb 2009) -- see SOURCE-NOTES.md item 3. Not resolved here; both kept as given,
# and the source's internal QA note text was not copied into Publication.note.

